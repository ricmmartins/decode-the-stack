name: Publish daily Decode the Stack editions

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decode-the-stack-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audio generation dependency
        run: python -m pip install -r requirements.txt

      - name: Test feed parsing and edition generation
        run: python -m unittest discover -s pipeline -p "test_*.py"

      - name: Generate today's source-linked edition
        run: python pipeline/publish.py

      - name: Generate English headline bulletin and podcast RSS
        run: python pipeline/podcast.py --date "$(date -u +%F)"
        env:
          PODCAST_OWNER_EMAIL: ${{ secrets.PODCAST_OWNER_EMAIL }}
        continue-on-error: true

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.160.1"
          extended: true

      - name: Build site
        run: hugo --minify --cleanDestinationDir --destination public

      - name: Validate generated site
        run: python pipeline/validate_site.py public

      - name: Commit generated edition
        run: |
          git config user.name "Decode the Stack Bot"
          git config user.email "decode-the-stack-bot@users.noreply.github.com"
          for path in content/posts data/editions static/podcast; do
            [ ! -d "$path" ] || git add "$path"
          done
          git add data/stats.json
          if git diff --cached --quiet; then
            echo "No new edition to commit."
          else
            git commit -m "Publish daily tech briefing"
            git push
          fi
