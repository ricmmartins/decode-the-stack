{{ define "main" }}
<header class="page-header">
  <p class="eyebrow">Find your signal</p>
  <h1>Search the editions</h1>
  <p class="post-description">Search the archive's headlines, publisher links, and analysis.</p>
</header>
<section class="search-panel" aria-label="Search editions">
  <label for="site-search">Search all editions</label>
  <input id="site-search" type="search" placeholder="Try cloud, Kubernetes, security…" autocomplete="off">
  <p id="search-status" class="search-status" aria-live="polite">Enter a search term to find editions.</p>
  <div id="search-results" class="editions-grid"></div>
</section>
{{ end }}
