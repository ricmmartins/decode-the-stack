<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="site-base" content="{{ site.BaseURL }}">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" type="image/svg+xml" href="{{ "images/brand-mark.svg" | relURL }}">
  <link rel="manifest" href="{{ "manifest.json" | relURL }}">
  <link rel="alternate" type="application/rss+xml" title="Decode the Stack — RSS" href="{{ "index.xml" | relURL }}">
  <link rel="alternate" type="application/rss+xml" title="Decode the Stack Podcast" href="{{ "podcast/feed.xml" | relURL }}">
  <meta property="og:site_name" content="{{ site.Title }}">
  <meta property="og:title" content="{{ .Title | default site.Title }}">
  <meta property="og:description" content="{{ .Description | default site.Params.description }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ "images/podcast-cover.png" | absURL }}">
  <meta name="twitter:card" content="summary_large_image">
  <title>{{ if .IsHome }}{{ site.Title }} — {{ site.Params.description }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  {{ partial "schema.html" . }}
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('pref-theme');
        const theme = saved === 'dark' || saved === 'light' ? saved : 'light';
        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
</head>
<body id="top">
  {{ partial "header.html" . }}
  <main id="main" class="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $js := resources.Get "js/main.js" | minify | fingerprint }}
  <script defer src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"></script>
</body>
</html>
