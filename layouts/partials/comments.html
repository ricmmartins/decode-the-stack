{{- with site.Params.giscus }}
<section class="section-block" aria-labelledby="comments-title">
  <h2 id="comments-title">Comments</h2>
  <p>Sign in with GitHub to join the discussion.</p>
  <div class="giscus"></div>
  <script src="https://giscus.app/client.js"
    data-repo="{{ .repo }}"
    data-repo-id="{{ .repoId }}"
    data-category="{{ .category }}"
    data-category-id="{{ .categoryId }}"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="preferred_color_scheme"
    data-lang="en"
    crossorigin="anonymous"
    async></script>
  <noscript>Enable JavaScript to load comments from <a href="https://github.com/{{ .repo }}/discussions">GitHub Discussions</a>.</noscript>
</section>
{{- end }}
