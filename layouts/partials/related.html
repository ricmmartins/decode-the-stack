{{- $related := .Site.RegularPages.Related . | first 3 -}}
{{- if $related }}
<section class="related-posts" aria-labelledby="related-title">
  <h2 id="related-title">Related editions</h2>
  <ul>
    {{- range $related }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format "January 2, 2006" }}</time></li>
    {{- end }}
  </ul>
</section>
{{- end }}
