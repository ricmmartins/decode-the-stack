<header class="site-header">
  <nav class="nav container" aria-label="Main navigation">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="Decode the Stack home">
      <img src="{{ "images/brand-mark.svg" | relURL }}" width="42" height="42" alt="">
      <span>decode <span class="brand-accent">the stack</span></span>
    </a>
    <ul class="menu">
      {{ range site.Menus.main }}
      <li><a href="{{ .URL | relURL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) (eq $.RelPermalink (.URL | relURL)) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
    <div class="nav-actions">
      <a class="search-link" href="{{ "search/" | relURL }}">Search</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme">
        <span aria-hidden="true">◐</span>
      </button>
    </div>
  </nav>
</header>
