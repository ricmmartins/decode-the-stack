<a class="skip-link" href="#main">Skip to content</a>
<header class="header site-header">
  <nav class="site-nav" aria-label="Main navigation">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="Decode the Stack — home">
      <img src="{{ "images/brand-mark.svg" | relURL }}" width="44" height="44" alt="" fetchpriority="high">
      <span class="brand-wordmark">Decode <span>the Stack</span></span>
    </a>
    <ul class="site-menu">
      {{- $current := . }}
      {{- range site.Menus.main }}
      <li><a href="{{ .URL | relURL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) (eq $current.RelPermalink (.URL | relURL)) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
    <div class="nav-actions">
      <a class="nav-search" href="{{ "search/" | relURL }}" aria-label="Search the site" accesskey="/">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><span>Search</span>
      </a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme" accesskey="t">
        <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
      </button>
    </div>
  </nav>
</header>
