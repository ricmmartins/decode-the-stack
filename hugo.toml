baseURL = "https://decodethestack.pages.dev/"
locale = "en"
defaultContentLanguage = "en"
title = "Decode the Stack"
enableRobotsTXT = true
enableGitInfo = false
summaryLength = 36
timeZone = "UTC"
paginate = 12

[params]
  description = "The daily technology briefing for software professionals. Source-linked software engineering, cloud, AI/ML, DevOps & SRE, and security."
  author = "Decode the Stack"
  defaultTheme = "light"
  mainSections = ["posts"]
  images = ["images/brand-mark.svg"]

[params.label]
  text = "Decode the Stack"
  icon = "images/brand-mark.svg"
  iconHeight = 38

[params.giscus]
  repo = "ricmmartins/decode-the-stack"
  repoId = "R_kgDOVfkfHw"
  category = "Announcements"
  categoryId = "DIC_kwDOVfkfH84DKLrd"

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Editions"
    url = "posts/"
    weight = 10
  [[menu.main]]
    identifier = "categories"
    name = "Categories"
    url = "categories/"
    weight = 20
  [[menu.main]]
    identifier = "podcast"
    name = "Podcast"
    url = "podcast/"
    weight = 30
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "about/"
    weight = 40

[taxonomies]
  category = "categories"
  tag = "tags"

[[module.mounts]]
  source = "data"
  target = "data"
  files = ["! *.md", "! *.txt", "! **/*.md", "! **/*.txt", "**"]

[[module.mounts]]
  source = "static/data"
  target = "data/pipeline"

[services.rss]
  limit = 30

[related]
  includeNewer = true
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 80

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  codeFences = true
  noClasses = false

[markup.tableOfContents]
  endLevel = 4
  startLevel = 2
